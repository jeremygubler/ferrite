[package]
name = "ferrite-parity"
description = "Reed-Solomon P+Q over GF(2^8) for Ferrite. Pure computation, no I/O, no dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Absichtlich leer, aus demselben Grund wie bei `format`: Dieses Crate rechnet
# nur. Kein I/O, keine Konfiguration, keine Uhrzeit, kein Zufall aus der
# Umgebung — Zufall und Zeit kommen als Parameter herein. Damit laesst sich die
# Rekonstruktion vollstaendig pruefen, ohne eine Platte anzufassen.
[dependencies]

# Ohne Harness: `cargo bench` ruft einfach `main` auf. Das spart eine
# Test-Dependency und den Nightly-Zwang von `#[bench]` — gemessen wird mit
# `Instant`, und zwar im Bench-Target, nicht im Crate. Das Crate selbst bleibt
# ohne Uhr (Regel 8).
[[bench]]
name = "throughput"
harness = false
