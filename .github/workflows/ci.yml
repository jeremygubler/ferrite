name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test, Clippy, Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Zuerst das Format, dann Clippy, dann die Tests: Wer die Reihenfolge
      # umdreht, wartet auf einen Testlauf, um dann an einer Leerzeile zu
      # scheitern.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # `format/fuzz` ist ein eigener Workspace und wird von den Schritten
      # darueber nicht erfasst. Gebaut wird es im Fuzz-Job; hier laeuft nur,
      # was auch auf Stable geht.
      - name: cargo fmt --check (fuzz)
        run: cargo fmt --all --check --manifest-path format/fuzz/Cargo.toml

  block-devices:
    # Die `#[ignore]`-Tests aus `engine/tests/loop_device.rs`. Sie brauchen
    # Linux und Root und laufen deshalb nicht im normalen Testlauf mit — ohne
    # diesen Job wuerden sie nie ausgefuehrt und waeren nach der dritten
    # Aenderung stillschweigend kaputt.
    name: Blockgeraete (Loop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # Gebaut wird als normaler Nutzer, damit der Cache derselbe bleibt;
      # nur das Ausfuehren braucht Root. `--no-run` gibt den Pfad des
      # Testbinaers aus, das danach unter `sudo` startet.
      - name: Testbinary bauen
        run: cargo test -p ferrite-engine --test loop_device --no-run

      - name: Voraussetzungen melden
        run: |
          echo "Kernel: $(uname -r)"
          losetup --version
          losetup -a

      # `-E` erhaelt die Umgebung, sonst findet `sudo` weder Cargo noch die
      # Bibliothekspfade des Builds.
      - name: Loop-Geraete-Tests
        run: sudo -E $(cargo test -p ferrite-engine --test loop_device --no-run --message-format=json 2>/dev/null | grep -o '"executable":"[^"]*loop_device[^"]*"' | tail -1 | cut -d'"' -f4) --ignored --nocapture --test-threads=1

      # Ein abgebrochener Test kann ein Loop-Geraet zurueckgelassen haben. Auf
      # einem Runner ist das folgenlos, aber es soll im Log stehen.
      - name: Reste melden
        if: always()
        run: losetup -a

  crash:
    # Meilenstein 3. Bricht den Schreibpfad an jedem einzelnen I/O-Punkt ab und
    # prueft danach, dass sich das Array oeffnen laesst, die Paritaet passt und
    # kein bestaetigter Write fehlt.
    #
    # Braucht weder Root noch einen besonderen Kernel — nur Linux, weil der
    # Abbruch ein SIGKILL an den eigenen Prozess ist. Deshalb steht dieser Job
    # nicht bei den Geraete-Jobs, sondern gehoert zum Pflichtteil.
    name: Crash-Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # `--nocapture`, damit im Log steht, wieviele Punkte geprueft wurden.
      # Eine Zahl, die still von 80 auf 3 faellt, waere sonst nicht zu sehen.
      - name: Absturz an jedem I/O-Punkt
        run: cargo test -p ferrite-harness --test crash -- --nocapture --test-threads=1

  faulty-devices:
    # Die zweite Haelfte von Meilenstein 3: Geraete, die Lesefehler liefern,
    # Writes verschlucken oder Bytes verfaelschen. Braucht Root und die Module
    # `dm_dust`/`dm_flakey`.
    name: Fehlerhafte Geraete (dm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # Die dm-Targets liegen auf den Runnern im Extra-Paket — jedenfalls die,
      # die es hineingeschafft haben. `dm_flakey` ist dort, `dm_dust` nicht:
      # Der Azure-Kernel baut es nicht mit. Deshalb wird `flakey` verlangt und
      # `dust` nur gemeldet.
      #
      # Verlangt wird bewusst mindestens eines: Die Tests ueberspringen sich
      # selbst, wenn ein Target fehlt — das ist auf einem Entwicklerrechner
      # richtig, in CI waere es sonst ein gruener Job ohne jeden Nachweis.
      - name: dm-Targets bereitstellen und pruefen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || true
          sudo modprobe dm_flakey || true
          sudo modprobe dm_dust || echo "Hinweis: dm_dust fehlt in diesem Kernel"
          echo "Kernel: $(uname -r)"
          sudo dmsetup targets
          sudo dmsetup targets | grep -q '^flakey' || { echo "dm-flakey fehlt — der Job haette nichts geprueft"; exit 1; }
          if sudo dmsetup targets | grep -q '^dust'; then
            echo "dm-dust vorhanden, die Lesefehler-Tests laufen mit"
          else
            echo "dm-dust fehlt: die Lesefehler-Tests ueberspringen sich, der Rest laeuft"
          fi

      - name: Testbinary bauen
        run: cargo test -p ferrite-harness --test faulty_devices --no-run

      - name: Tests gegen fehlerhafte Geraete
        run: sudo -E $(cargo test -p ferrite-harness --test faulty_devices --no-run --message-format=json 2>/dev/null | grep -o '"executable":"[^"]*faulty_devices[^"]*"' | tail -1 | cut -d'"' -f4) --ignored --nocapture --test-threads=1

      - name: Reste melden
        if: always()
        run: |
          sudo dmsetup ls || true
          losetup -a || true

  ublk:
    # Die `#[ignore]`-Tests aus `engine/tests/ublk.rs`. Sie legen echte
    # Blockgeraete im Kernel an — ohne diesen Job liefe der ublk-Pfad
    # ausschliesslich auf dem Rechner des Entwicklers.
    name: ublk-Target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # `ublk_drv` liegt auf den Runnern im Extra-Paket, nicht im Grundkernel.
      # btrfs-progs ist fuer den Durchstich-Test noetig.
      - name: ublk_drv und btrfs bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" btrfs-progs
          sudo modprobe ublk_drv
          sudo modprobe btrfs
          echo "Kernel: $(uname -r)"
          ls -l /dev/ublk-control

      - name: Testbinary bauen
        run: cargo test -p ferrite-engine --test ublk --no-run

      # `--test-threads=1`: Jeder Test legt ein Geraet im Kernel an, und zwei
      # davon gleichzeitig konkurrieren um Geraetenummern und Loop-Geraete.
      - name: ublk-Tests
        run: sudo -E $(cargo test -p ferrite-engine --test ublk --no-run --message-format=json 2>/dev/null | grep -o '"executable":"[^"]*ublk[^"]*"' | tail -1 | cut -d'"' -f4) --ignored --nocapture --test-threads=1

      # Meilenstein 4 am Stueck: echtes btrfs auf einem Ferrite-Geraet, echter
      # Rost auf der Platte, echter Scrub, echte Reparatur. Der Test liest den
      # Kernel-Ringpuffer und haengt damit an der Formulierung, die dieser
      # Kernel waehlt — genau deshalb laeuft er hier und nicht nur lokal.
      - name: Selbstheilung mit btrfs
        run: |
          cargo test -p ferrite-harness --test btrfs_repair --no-run
          sudo -E $(cargo test -p ferrite-harness --test btrfs_repair --no-run --message-format=json 2>/dev/null | grep -o '"executable":"[^"]*btrfs_repair[^"]*"' | tail -1 | cut -d'"' -f4) --ignored --nocapture --test-threads=1

      # Der Durchstich von aussen: `ferrite create`, `ferrite run`, btrfs auf
      # den entstandenen Blockgeraeten, der Pool darueber, eine Datei
      # hineingeschrieben — und nach einem Neustart wieder herausgelesen. Das
      # ist der Weg, den ein Nutzer geht.
      - name: Das Werkzeug am ganzen Stapel
        run: |
          sudo modprobe fuse || true
          cargo test -p ferrite-ctl --test serve --no-run
          sudo -E $(cargo test -p ferrite-ctl --test serve --no-run --message-format=json 2>/dev/null | grep -o '"executable":"[^"]*serve[^"]*"' | tail -1 | cut -d'"' -f4) --ignored --nocapture --test-threads=1

      # Ein abgebrochener Test kann ein Geraet zurueckgelassen haben. Auf einem
      # Runner ist das folgenlos, aber es soll im Log stehen.
      - name: Reste melden
        if: always()
        run: |
          ls -l /dev/ublkb* /dev/ublkc* 2>/dev/null || echo "keine ublk-Geraete uebrig"
          losetup -a || true

  pool:
    # Meilenstein 5: der Pool eingehaengt, mit einem echten Kernel dahinter.
    # Ohne diesen Job liefe die FUSE-Schale ausschliesslich auf dem Rechner des
    # Entwicklers — und ein Dateisystem, das nur dort einhaengt, ist keins.
    name: Pool-Namespace (FUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # Verlangt und nicht nur gemeldet: Die Tests ueberspringen sich selbst,
      # wenn `/dev/fuse` fehlt. Auf einem Entwicklerrechner ist das richtig, in
      # CI waere es ein gruener Job ohne jeden Nachweis.
      - name: /dev/fuse bereitstellen und pruefen
        run: |
          sudo modprobe fuse || true
          KERNEL=$(uname -r)
          echo "Kernel: $KERNEL"
          test -c /dev/fuse || { echo "/dev/fuse fehlt — der Job haette nichts geprueft"; exit 1; }
          ls -l /dev/fuse
          # Der Passthrough braucht 6.9. Ist der Runner aelter, ueberspringen
          # sich genau die Tests, die ihn nachweisen — das gehoert sichtbar
          # ins Log und nicht in eine Zeile, die niemand liest.
          MAJOR=${KERNEL%%.*}; REST=${KERNEL#*.}; MINOR=${REST%%.*}
          if [ "$MAJOR" -gt 6 ] || { [ "$MAJOR" -eq 6 ] && [ "$MINOR" -ge 9 ]; }; then
            echo "Passthrough: wird geprueft."
          else
            echo "ACHTUNG: Kernel $KERNEL kennt keinen Passthrough — diese Tests ueberspringen sich."
          fi

      # `setfacl`/`getfacl` fuer die ACL-Tests. Verlangt und nicht nur
      # gemeldet: Ohne die Werkzeuge ueberspringen sich genau die Tests, die
      # den Umask-Pfad nachweisen.
      - name: ACL-Werkzeuge bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq acl
          setfacl --version

      - name: Testbinary bauen
        run: cargo test -p ferrite-pool --test mount --no-run

      # `--test-threads=1`: Jeder Test haengt ein Dateisystem ein, und zwei
      # gleichzeitig streiten sich um denselben Einhaengepunkt.
      - name: Mount-Tests
        run: sudo -E $(cargo test -p ferrite-pool --test mount --no-run --message-format=json 2>/dev/null | grep -o '"executable":"[^"]*mount[^"]*"' | tail -1 | cut -d'"' -f4) --ignored --nocapture --test-threads=1

      # Ein abgebrochener Test kann einen Einhaengepunkt zurueckgelassen haben.
      # Jeder Zugriff darauf haengt dann — das soll im Log stehen.
      - name: Reste melden
        if: always()
        run: mount | grep -E 'fuse\.ferrite|ferrite-pool' || echo "keine Pool-Mounts uebrig"

  msrv:
    # `rust-version = "1.75"` steht in jeder Cargo.toml. Ohne diesen Job ist das
    # eine Behauptung: Der Test-Job baut mit `stable` und wuerde nicht merken,
    # wenn jemand etwas Neueres benutzt.
    #
    # Gebaut, nicht getestet. Die Tests brauchen dieselbe Sprache wie das Crate,
    # aber wer die MSRV halten will, interessiert sich dafuer, ob es
    # uebersetzt — und ein Testlauf kostet hier nur Zeit.
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install 1.75 --profile minimal
          rustup default 1.75
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check
        run: cargo check --all-targets --all-features

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # Ein Fund in einem Target soll die anderen nicht abwuergen — sie
      # koennten je einen eigenen haben.
      fail-fast: false
      matrix:
        target:
          - superblock_decode
          - log_header_decode
          - superblock_roundtrip
          - chain_replay
          - log_ring_replay
          - assemble_array
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            format/fuzz

      - name: cargo-fuzz installieren
        run: cargo install cargo-fuzz --locked

      # Kurzer Lauf pro Push. Das ist keine Fuzzing-Kampagne, sondern eine
      # Rauchprobe: Sie faengt das, was eine Aenderung sofort kaputt macht.
      # Die langen Laeufe passieren ausserhalb von CI und ihre Funde landen als
      # Regressionstests in `format/tests/roundtrip.rs`.
      - name: ${{ matrix.target }}
        working-directory: format
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -print_final_stats=1

      # Ohne diesen Schritt muesste man den Crash aus dem Log rekonstruieren.
      - name: Absturzeingabe sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: format/fuzz/artifacts/
          if-no-files-found: ignore

  package:
    # Ein Paket, das nur gebaut wird, ist ein Paket, von dem niemand weiss, ob
    # es sich installieren laesst. Dieser Job installiert es auf dem Runner und
    # benutzt danach das Binary aus /usr/bin — nicht das aus target/.
    name: Paket (.deb, .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Werkzeuge bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian rpm groff-base cockpit-bridge jq
          lintian --version
          rpmbuild --version

      - name: Release bauen
        run: cargo build --release -p ferrite-ctl

      - name: Paket bauen
        id: build
        run: |
          DEB=$(packaging/build-deb.sh target/release/ferrite target/packages)
          RPM=$(packaging/build-rpm.sh target/release/ferrite target/packages)
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "rpm=$RPM" >> "$GITHUB_OUTPUT"
          ls -l target/packages

      # `--fail-on error`: Zwei Warnungen bleiben stehen, und beide mit Grund.
      # `maintainer-script-calls-systemctl` trifft das `daemon-reload` im
      # postinst (dafuer gibt es keinen dpkg-Trigger) und den Rueckfall im
      # prerm, falls `deb-systemd-invoke` fehlt. Beide stehen kommentiert im
      # Skript. Fehler sind etwas anderes und lassen den Job scheitern.
      - name: lintian
        run: |
          lintian --tag-display-limit 0 "${{ steps.build.outputs.deb }}" || true
          lintian --fail-on error "${{ steps.build.outputs.deb }}"

      - name: Installieren
        run: sudo apt-get install -y "$PWD/${{ steps.build.outputs.deb }}"

      # Ab hier wird nur noch benutzt, was das Paket abgelegt hat.
      - name: Was das Paket abgelegt hat
        run: |
          dpkg -L ferrite | sort
          test -x /usr/bin/ferrite
          test -f /lib/systemd/system/ferrite.service
          test -f /etc/ferrite/ferrite.conf
          test -f /usr/lib/modules-load.d/ferrite.conf
          test -d /var/lib/ferrite

      - name: Das installierte Binary laeuft
        run: |
          /usr/bin/ferrite version
          /usr/bin/ferrite --help > /dev/null

      # Die Oberflaeche zerlegt keine Prosa, sie liest JSON. Also muss das,
      # was herauskommt, ein echter Parser lesen koennen — und nicht der, den
      # dieses Projekt selbst geschrieben hat.
      - name: Die JSON-Ausgabe ist welches
        run: |
          set -e
          mkdir -p /tmp/json
          for name in a b p log; do truncate -s 64M "/tmp/json/$name.img"; done
          /usr/bin/ferrite create --data /tmp/json/a.img --data /tmp/json/b.img \
            --parity-p /tmp/json/p.img --log /tmp/json/log.img --yes > /dev/null
          /usr/bin/ferrite status /tmp/json/*.img --json | tee /tmp/json/status.json
          jq -e ".health == \"healthy\"" /tmp/json/status.json > /dev/null
          jq -e ".members | length == 4" /tmp/json/status.json > /dev/null
          jq -e ".members[0].role == \"data\" and .members[0].state == \"clean\"" /tmp/json/status.json > /dev/null
          /usr/bin/ferrite discover /tmp/json --json | jq -e ".arrays | length == 1" > /dev/null
          # Auch der Fehlerfall ist ein Objekt und keine Prosa auf stderr:
          # Eine Oberflaeche, die hier nichts bekaeme, zeigte eine leere Seite.
          /usr/bin/ferrite status --config /tmp/json/gibtsnicht.conf --json \
            | jq -e ".health == \"broken\" and (.error | length > 0)" > /dev/null
          echo "JSON: von jq gelesen"

      # Ein Modul mit kaputtem Manifest faellt sonst erst dem auf, der die
      # Seite aufschlaegt — und der sieht nur, dass sie im Menue fehlt.
      - name: Das Cockpit-Modul
        run: |
          set -e
          node --check /usr/share/cockpit/ferrite/ferrite.js
          python3 -m json.tool /usr/share/cockpit/ferrite/manifest.json > /dev/null
          cockpit-bridge --packages | grep -q "^ferrite " \
            || { echo "cockpit kennt das Modul nicht"; cockpit-bridge --packages; exit 1; }
          cockpit-bridge --packages | grep "^ferrite "

      # Eine Handbuchseite, die roff nicht uebersetzen kann, faellt sonst erst
      # dem auf, der sie aufschlaegt.
      - name: Handbuchseite
        run: |
          man -w ferrite
          zcat /usr/share/man/man8/ferrite.8.gz > /tmp/ferrite.8
          MECKER=$(LC_ALL=C groff -man -z -ww /tmp/ferrite.8 2>&1)
          if [ -n "$MECKER" ]; then echo "$MECKER"; exit 1; fi
          echo "groff: sauber"

      - name: systemd-Units
        run: |
          systemd-analyze verify /lib/systemd/system/ferrite.service
          systemd-analyze verify /lib/systemd/system/ferrite-scrub.timer
          systemd-analyze verify /lib/systemd/system/ferrite-check.timer
          # Verlangt und nicht nur gemeldet: Ein Paket, das beim Auspacken
          # Blockgeraete uebernimmt, hat sich diese Entscheidung angemasst.
          for unit in ferrite.service ferrite-scrub.timer ferrite-check.timer; do
            state=$(systemctl is-enabled "$unit" || true)
            [ "$state" = disabled ] || { echo "$unit ist $state statt disabled"; exit 1; }
          done

      # Der eigentliche Nachweis: Das Binary aus dem Paket legt ein Array an
      # und liest es wieder. Ein `--version`, das laeuft, sagt nur, dass die
      # Datei nicht leer ist.
      - name: Ein Array mit dem installierten Werkzeug
        run: |
          set -e
          mkdir -p /tmp/disks /tmp/ferrite-dev
          for name in d0 d1 p q log; do
            truncate -s 64M "/tmp/disks/$name.img"
            dev=$(sudo losetup --find --show "/tmp/disks/$name.img")
            eval "LOOP_$name=$dev"
            ln -s "$dev" "/tmp/ferrite-dev/$name"
          done
          # `discover` bekommt ein eigenes Verzeichnis mit Verweisen. Es auf
          # /dev loszulassen hiesse, jeden Knoten dort zu oeffnen — darunter
          # welche, die beim Lesen blockieren.
          UUID=$(sudo /usr/bin/ferrite create \
            --data "$LOOP_d0" --data "$LOOP_d1" \
            --parity-p "$LOOP_p" --parity-q "$LOOP_q" \
            --log "$LOOP_log" --label ci-paket --yes \
            | sed -n 's/^Array \([0-9a-f-]*\) angelegt.*/\1/p')
          test -n "$UUID" || { echo "create hat keine Array-UUID gemeldet"; exit 1; }
          sudo /usr/bin/ferrite status "$LOOP_d0" "$LOOP_d1" "$LOOP_p" "$LOOP_q" "$LOOP_log"
          sudo /usr/bin/ferrite discover /tmp/ferrite-dev | grep -q "$UUID" \
            || { echo "discover findet das frisch angelegte Array nicht"; exit 1; }
          for name in d0 d1 p q log; do
            eval "sudo losetup -d \$LOOP_$name" || true
          done

      # Der Klassiker unter den Paketfehlern: Das Upgrade setzt die
      # Konfiguration zurueck, und das Array kommt nach dem naechsten
      # `apt upgrade` nicht mehr hoch.
      - name: Die Konfiguration ueberlebt eine Neuinstallation
        run: |
          echo "# von CI geaendert" | sudo tee -a /etc/ferrite/ferrite.conf > /dev/null
          sudo apt-get install -y --reinstall "$PWD/${{ steps.build.outputs.deb }}"
          grep -q "von CI geaendert" /etc/ferrite/ferrite.conf \
            || { echo "die Konffile wurde ueberschrieben"; exit 1; }

      - name: Entfernen und purgen
        run: |
          sudo apt-get remove -y ferrite
          test ! -e /usr/bin/ferrite || { echo "das Binary blieb liegen"; exit 1; }
          test -e /etc/ferrite/ferrite.conf \
            || { echo "remove hat die Konffile mitgenommen"; exit 1; }
          sudo apt-get purge -y ferrite
          test ! -e /etc/ferrite/ferrite.conf || { echo "purge liess die Konffile stehen"; exit 1; }

      # Was nur in einem der beiden Pakete landet, faellt sonst erst dem auf,
      # der die andere Distribution benutzt. `ctl/tests/packaging.rs` haelt die
      # Bauwege gegeneinander; hier stehen die fertigen Pakete nebeneinander.
      # Die Dokumentation bleibt draussen: Debian will changelog.gz und
      # copyright, RPM will %license — das ist kein Auseinanderlaufen, sondern
      # zweimal dieselbe Regel verschiedener Distributionen.
      - name: Beide Pakete tragen dasselbe
        run: |
          liste() {
            sed -e 's|^/lib/systemd|/usr/lib/systemd|' \
              | grep -v '^/usr/share/doc' \
              | grep -v '^/\.$' \
              | sort -u
          }
          dpkg -c "${{ steps.build.outputs.deb }}" | awk '$6 ~ /^\.\// && $1 !~ /^d/ {print substr($6,2)}' | liste > /tmp/deb.txt
          # `-v`, um die Verzeichnisse zu erkennen: dpkg listet sie mit `d`,
          # rpm ohne `-v` gar nicht als solche.
          rpm -qlvp "${{ steps.build.outputs.rpm }}" | awk '$1 !~ /^d/ {print $NF}' | liste > /tmp/rpm.txt
          diff -u /tmp/deb.txt /tmp/rpm.txt

      # Das Paket traegt ein gestripptes Binary. Wer einen Backtrace von einer
      # echten Maschine aufloesen will, braucht das ungestrippte aus demselben
      # Bau — sonst ist der Bericht eine Liste von Adressen.
      - name: Paket und Symbole sichern
        uses: actions/upload-artifact@v7
        with:
