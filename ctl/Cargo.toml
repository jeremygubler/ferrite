[package]
name = "ferrite-ctl"
description = "Das Werkzeug: ein Ferrite-Array anlegen und seinen Zustand ansehen."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferrite"
path = "src/main.rs"

# Keine fremden Crates. Das Zerlegen einer Kommandozeile ist ein paar hundert
# Zeilen, seine Fehler zeigen sich beim ersten Aufruf, und die Meldungen
# gehoeren bei einem Werkzeug, das Platten beschreibt, in dieselbe Hand wie
# der Rest.
[dependencies]
ferrite-engine = { path = "../engine" }
ferrite-format = { path = "../format" }
ferrite-pool = { path = "../pool" }

# Signale, `mount(2)` und `umount2` — in `std` gibt es davon nichts. Nur fuer
# `ferrite run` und nur unter Linux; `create` und `status` kommen ohne aus.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Der Durchstich schickt SIGTERM und fragt nach der eigenen Nutzerkennung.
libc = "0.2"
