[package]
name = "ferrite-harness"
description = "Crash-Harness: Stromausfall an jedem Punkt des Schreibpfads, danach Recovery und Paritaetspruefung."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Das Feature `crash-points` ist hier fest eingeschaltet und nirgends sonst.
# Wer `ferrite-engine` normal baut, bekommt keinen Selbstmordpfad mit.
[dependencies]
ferrite-engine = { path = "../engine", features = ["crash-points"] }
ferrite-format = { path = "../format" }

[dev-dependencies]
# Der Broker wird hier gegen ein echtes Array gefuehrt, nicht gegen eine
# Attrappe. Nur zum Testen — das Harness selbst repariert nichts.
ferrite-broker = { path = "../broker" }
