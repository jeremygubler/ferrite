[package]
name = "ferrite-pool"
description = "Der Pool-Namespace: Platzierungsregeln und Vereinigung mehrerer Data-Members zu einer Sicht."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Die reinen Teile — `place`, `merge`, `path`, `policy` — kommen ohne aus, wie
# `format/` und `parity/`. Deshalb steht hier nichts.
[dependencies]
# Die FUSE-Schale braucht `mount(2)`, `/dev/fuse` und `statvfs` — in `std` gibt
# es davon nichts. Nur fuer Linux und nur fuer `fuse/`; die Entscheidungen in
# `place`, `merge` und `path` bleiben dependency-frei und laufen ueberall.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
